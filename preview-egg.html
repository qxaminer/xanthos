<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Egg Preview</title>
    <style>
        body {
            font-family: "Minion Pro", Georgia, serif;
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
            padding: 20px;
            background: #fafafa;
        }

        .logo-container {
            position: relative;
            width: 300px;
            height: 200px;
            margin: 0 auto 10px;
        }

        .logo-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-iron {
            animation: fadeInOut 3.2s ease-in-out infinite;
        }

        .logo-rust {
            animation: fadeOutIn 3.2s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        @keyframes fadeOutIn {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .egg-container {
            position: relative;
            width: 120px;
            height: 160px;
            margin: 0 auto 20px;
        }

        .egg-half {
            position: absolute;
            width: 50px;
            height: 100px;
            background: linear-gradient(135deg, #CE4F1A 0%, #8B3010 100%);
            top: 0;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.3),
                        inset 3px 3px 8px rgba(255,255,255,0.15);
        }

        .egg-half.left {
            left: 10px;
            border-radius: 80% 0 0 60% / 60% 0 0 40%;
            transform: rotate(-12deg);
            clip-path: polygon(0 0, 100% 5%, 95% 40%, 100% 60%, 90% 100%, 0 100%);
        }

        .egg-half.right {
            right: 10px;
            border-radius: 0 80% 60% 0 / 0 60% 40% 0;
            transform: rotate(12deg);
            clip-path: polygon(0 5%, 100% 0, 100% 100%, 10% 100%, 0 60%, 5% 40%);
        }

        .spill {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .spill-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .baby-crab {
            font-size: 16px;
            animation: wiggle 0.4s ease-in-out infinite alternate;
        }

        .baby-crab:nth-child(2) { animation-delay: 0.1s; }
        .baby-crab:nth-child(3) { animation-delay: 0.2s; }

        .code-bit {
            font-family: "SF Mono", "Monaco", monospace;
            font-size: 11px;
            color: #8B3010;
            font-weight: bold;
        }

        @keyframes wiggle {
            from { transform: rotate(-15deg) scale(1); }
            to { transform: rotate(15deg) scale(1.1); }
        }

        h1 { font-size: 3em; margin: 0; }
        .tagline { font-size: 1.5em; color: #CE4F1A; margin: 20px 0; }
        .subtitle { color: #64748B; }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="RUST_crab.png" alt="Rust Crab" class="logo-rust">
        <img src="Iron_crab.png" alt="Iron Crab" class="logo-iron">
    </div>

    <div class="egg-container">
        <div class="egg-half left"></div>
        <div class="egg-half right"></div>
        <div class="spill">
            <div class="spill-row">
                <span class="baby-crab">🦀</span>
            </div>
            <div class="spill-row">
                <span class="code-bit">fn</span>
                <span class="baby-crab">🦀</span>
                <span class="code-bit">main()</span>
            </div>
            <div class="spill-row">
                <span class="baby-crab">🦀</span>
                <span class="code-bit">{</span>
                <span class="baby-crab">🦀</span>
            </div>
            <div class="spill-row">
                <span class="code-bit">println!</span>
            </div>
            <div class="spill-row">
                <span class="baby-crab">🦀</span>
                <span class="code-bit">}</span>
                <span class="baby-crab">🦀</span>
            </div>
        </div>
    </div>

    <h1>Xanthos</h1>
    <p class="tagline">rustyport</p>
    <p class="subtitle">Building in public. Coming soon.</p>
</body>
</html>
