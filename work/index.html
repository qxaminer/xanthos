<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work — Xanthos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Minion Pro", Georgia, serif;
            background: #1a1a1a;
            color: #f5efe6;
            line-height: 1.7;
        }
        .wrap {
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }
        h1 {
            color: #D4AF37;
            font-size: 2.2em;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #c7b8a0;
            font-style: italic;
            margin-bottom: 40px;
        }
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .project-card {
            background: rgba(250, 250, 250, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 24px 28px;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: border-color 0.2s;
        }
        .project-card:hover { border-color: rgba(206, 79, 26, 0.5); }
        .project-card h2 {
            color: #D4AF37;
            font-size: 1.3em;
            margin-bottom: 6px;
        }
        .project-card p { color: #c7b8a0; font-size: 0.95em; }
        .tag {
            display: inline-block;
            font-size: 0.75em;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid rgba(206, 79, 26, 0.4);
            color: #CE4F1A;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="nav-root"></div>
    <script src="../nav.js" data-root=".."></script>
    <div class="wrap">
        <h1>Work</h1>
        <p class="subtitle">Projects built in public.</p>
        <div class="project-list">
            <a class="project-card" href="sk8-xr/">
                <span class="tag">AR · iOS · RealityKit</span>
                <h2>SK8-XR</h2>
                <p>Location-based AR skateboarding instruction. Ghost skater figures anchor to real-world surfaces via LiDAR. Scrub tricks in slow motion, isolate body parts, navigate to spots with a live geo pointer.</p>
            </a>
        </div>
    </div>
</body>
</html>
